name: pingpulse

services:
  # auth-service'in veritabanı (PLAN §3: ilişkisel veri, FK, UNIQUE, transaction)
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pingpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-postgres-password}
      POSTGRES_DB: ${POSTGRES_DB:-auth}
    # Host portu sadece geliştirici erişimi içindir (prisma migrate, DB araçları).
    # Servisler DB'ye Docker iç ağı üzerinden (postgres:5432) bağlanır.
    # Standart dışı port: makinede yerel bir Postgres varsa çakışmasın.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -h ile TCP üzerinden kontrol edilir. Postgres ilk kurulumda geçici bir sunucuyu
      # sadece Unix socket ile açar; -h olmazsa o geçici sunucu "sağlıklı" görünür.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  # monitoring-service'in veritabanı. Sürüm sabit: partial TTL için 7.x gerekli (PLAN §8)
  mongo:
    image: mongo:7.0
    # Standart dışı host portu: makinede yerel bir MongoDB varsa çakışmasın.
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      PORT: 3001
      # Servis DB'ye Docker iç ağından bağlanır: host adı servis adıdır (postgres), port 5432.
      # Şifrede URL'de özel anlamı olan karakter (#, @, /) varsa DATABASE_URL doğrudan verilmelidir.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-pingpulse}:${POSTGRES_PASSWORD:-dev-only-postgres-password}@postgres:5432/${POSTGRES_DB:-auth}}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      # Plan değişikliğinde çağrılan monitoring internal API'si ve ortak secret'ı.
      MONITORING_URL: ${MONITORING_URL:-http://monitoring-api:3002}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-only-internal-token}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Slim imajda curl yok; Node'un kendi fetch'i kullanılır.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  monitoring-api:
    build:
      context: .
      dockerfile: services/monitoring/Dockerfile
    environment:
      PORT: 3002
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/monitoring}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-only-internal-token}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # API ile aynı imaj, farklı giriş noktası. API sağlıklı olmadan başlamaz: koleksiyonları API
  # oluşturur; worker da açılışta setup'ı çalıştırır ama ikisinin yarışmasına gerek kalmaz.
  monitoring-worker:
    build:
      context: .
      dockerfile: services/monitoring/Dockerfile
    command: ["node", "dist/worker.js"]
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/monitoring}
      CHECK_CONCURRENCY: ${CHECK_CONCURRENCY:-10}
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-60}
      CHECK_TIMEOUT_MS: ${CHECK_TIMEOUT_MS:-5000}
      WORKER_TICK_MS: ${WORKER_TICK_MS:-1000}
      # DNS çözümlemesi libuv thread pool'unu kullanır (varsayılan 4); CHECK_CONCURRENCY'den küçük olmamalı.
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:-16}
    depends_on:
      monitoring-api:
        condition: service_healthy

volumes:
  postgres-data:
  mongo-data:
